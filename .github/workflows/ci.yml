name: ci

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Extract firmware images from docker image
      run: |
        mkdir -p build
        docker run --rm -v $(pwd)/build:/build retro-go:latest sh -c 'set -e; cp /app/*.fw /build/ 2>/dev/null || true; cp /app/*.img /build/ 2>/dev/null || true; ls -lh /build'
        IMG="$(find build -maxdepth 1 -name '*.img' -type f | head -n1)"
        test -n "$IMG"
        test "$(stat -c%s "$IMG")" -eq 16384000
        grep -a -q "Sonic The Hedgehog (USA, Europe).md" "$IMG"
        cp "$IMG" build/retro-go.img

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: build/*
